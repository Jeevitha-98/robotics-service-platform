
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Platform // Provision Node Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-system-body">

    <!-- Cosmic Background Shaders Matrix Layers -->
    <div class="system-spatial-matrix-grid"></div>
    <div class="system-hero-dimmer-shield"></div>

    <!-- CENTRALIZED STACKLY REGISTER CARD MODEL HARNESS -->
    <main class="secure-auth-card-model">
        
        <!-- LEFT REGION: Registration Fields Console Workspace -->
        <section class="auth-card-form-wing">
            
            <!-- Floating Back-To-Login Trigger Route Capsule -->
            <div class="home-navigation-row">
                <a href="login.html" class="back-home-pill-btn">← Back to Log In</a>
            </div>

            <!-- Section Main Header Layer -->
            <div class="auth-header-block">
                <h1 class="auth-main-title">CREATE ACCOUNT</h1>
                <p class="auth-subtext-desc">Register your organizational profile to open your project registry deck.</p>
            </div>

            <!-- Interactive Form Registration Harness -->
            <form class="bionic-auth-form" id="stacklySignupForm" novalidate>
                
                
                <div class="form-input-group">
                    <label for="regFullNameField">FULL OPERATOR NAME</label>
                    <input type="text" class="console-input-node" id="regFullNameField" placeholder="Enter your full name" required>
                </div>

                <!-- Input 2: Core Key Email Address Routing -->
                <div class="form-input-group">
                    <label for="regEmailField">EMAIL ADDRESS</label>
                    <input type="email" class="console-input-node" id="regEmailField" placeholder="you@example.com" required>
                </div>

                <!-- Input 3: Primary Security Passkey -->
                <div class="form-input-group">
                    <label for="regPasswordField">PASSWORD</label>
                    <div class="password-node-wrapper">
                        <input type="password" class="console-input-node" id="regPasswordField" placeholder="••••••••" required>
                        <button type="button" class="password-visibility-toggle toggle-visibility-btn" aria-label="Toggle Password Visibility">
                            <svg class="svg-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Input 4: Secondary Security Passkey Validation Verification -->
                <div class="form-input-group">
                    <label for="regConfirmPasswordField">CONFIRM PASSWORD</label>
                    <div class="password-node-wrapper">
                        <input type="password" class="console-input-node" id="regConfirmPasswordField" placeholder="••••••••" required>
                        <button type="button" class="password-visibility-toggle toggle-visibility-btn" aria-label="Toggle Confirm Password Visibility">
                            <svg class="svg-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Diagnostic Notification Alerts Center Overlay Block -->
                <div class="auth-diagnostic-feedback" id="signupAlertBox"></div>

                <!-- Transmit Account Account Creation Dispatch Button Trigger -->
                <div class="form-submit-row">
                    <button type="submit" class="transmission-dispatch-btn" id="submitDispatchBtn">
                        <span class="btn-text-content">SIGN UP →</span>
                    </button>
                </div>

                <!-- Bottom Footer Footnote Navigation Route Link -->
                <div class="registration-footnote">
                    <p>Already have an account? <a href="login.html" class="create-account-link">Log In</a></p>
                </div>

            </form>
        </section>

        <!-- RIGHT REGION: Symmetrical Hardware Circuit Vector Overlay Blueprint Backplate -->
        <section class="auth-card-visual-wing">
            <div class="cinematic-core-window">
                <span class="core-telemetry-stamp">REGISTRY_PIPELINE // SECURE_PROVISION_V4</span>
                
                <svg class="quantum-core-matrix-vector" viewBox="0 0 200 200" xmlns="http://w3.org">
                    <defs>
                        <linearGradient id="armorMetalShade" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3f3f46"/>
                            <stop offset="60%" stop-color="#18181b"/>
                            <stop offset="100%" stop-color="#09090b"/>
                        </linearGradient>
                        <radialGradient id="processorLaserGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="45%" stop-color="#06b6d4"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </radialGradient>
                    </defs>
                    <circle cx="100" cy="100" r="86" fill="none" stroke="#1c1c1f" stroke-width="0.75" stroke-dasharray="4 6"/>
                    <rect x="25" y="25" width="150" height="150" fill="none" stroke="#141416" stroke-width="0.5" stroke-dasharray="2 4"/>
                    <line x1="100" y1="10" x2="100" y2="190" stroke="#1c1c1f" stroke-width="0.5" stroke-dasharray="2 2"/>
                    <g class="chassis-float-core">
                        <polygon points="100,34 156,66 154,134 100,166 46,134 44,66" fill="url(#armorMetalShade)" stroke="#27272a" stroke-width="2.5"/>
                        <path d="M100 34 V166 M44 66 H156 M44 134 H154" stroke="#050507" stroke-width="2" opacity="0.4"/>
                        <circle cx="72" cy="54" r="2" fill="#3f3f46"/>
                        <circle cx="128" cy="54" r="2" fill="#3f3f46"/>
                        <circle cx="72" cy="146" r="2" fill="#3f3f46"/>
                        <circle cx="128" cy="146" r="2" fill="#3f3f46"/>
                        <circle cx="100" cy="100" r="24" fill="url(#processorLaserGlow)" class="lens-glow-core-pulse" stroke="#06b6d4" stroke-width="1.5"/>
                        <circle cx="100" cy="100" r="9" fill="#050507" opacity="0.8"/>
                        <line x1="100" y1="100" x2="154" y2="66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" class="radar-scanline-actuator"/>
                    </g>
                </svg>

                <div class="crt-scanline-matrix"></div>
            </div>
        </section>

    </main>

<style>
    /* ==========================================================================
   SPATIAL CARD MODEL REGISTRATION (Enhanced Legibility & Proportions)
   ========================================================================== */
:root {
    --bg-universe-pitch: #050507;
    --surface-card-solid: #0d0d12;
    --text-pure-white: #ffffff;
    --text-muted-gray: #8b949e;
    --border-premium: rgba(255, 255, 255, 0.05);
    --border-active-cyan: #06b6d4;
    --font-display-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

.auth-system-body {
    background-color: var(--bg-universe-pitch);
    font-family: var(--font-display-stack);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 4%;
    position: relative;
    overflow-x: hidden;
}

.system-hero-dimmer-shield { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(5,5,7,0.4) 0%, rgba(5,5,7,0.95) 100%); z-index: 2; pointer-events: none; }
.system-spatial-matrix-grid { position: absolute; inset: 0; background-image: linear-gradient(to right, #101014 1px, transparent 1px), linear-gradient(to bottom, #101014 1px, transparent 1px); background-size: 56px 56px; opacity: 0.6; z-index: 1; pointer-events: none; }

/* Central Twin-Column Enclosure Blueprint matching login exactly */
.secure-auth-card-model {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 960px;
    background-color: #09090d;
    border: 1px solid var(--border-premium);
    border-radius: 28px;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 40px rgba(6, 182, 212, 0.03);
    overflow: hidden;
}

.auth-card-form-wing {
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.home-navigation-row { width: 100%; display: flex; justify-content: flex-end; }
.back-home-pill-btn {
    padding: 6px 16px; background-color: var(--text-pure-white); color: var(--bg-universe-pitch);
    font-size: 0.82rem; font-weight: 700; text-decoration: none; border-radius: 100px; transition: transform 0.2s;
}
.back-home-pill-btn:hover { transform: translateY(-2px); }

.auth-header-block { display: flex; flex-direction: column; gap: 8px; }
.auth-main-title { font-size: 2.1rem; font-weight: 900; letter-spacing: -0.03em; color: var(--text-pure-white); text-transform: uppercase; }
.auth-subtext-desc { font-size: 0.95rem; color: var(--text-muted-gray); line-height: 1.5; }

.bionic-auth-form { display: flex; flex-direction: column; gap: 18px; }
.form-input-group { display: flex; flex-direction: column; gap: 8px; }

.form-input-group label {
    font-family: monospace; font-size: 0.72rem; font-weight: 700; color: #4b5563; letter-spacing: 0.06em;
}

/* Enhanced Font Scales for Inputs Fields */
.console-input-node {
    width: 100%;
    background-color: rgba(5, 5, 7, 0.5);
    border: 1px solid var(--border-premium);
    border-radius: 8px;
    padding: 13px 16px;
    color: var(--text-pure-white);
    font-size: 1.05rem; /* Locked uniform text dimension boost parameter */
    font-family: var(--font-display-stack);
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.console-input-node::placeholder { color: #2e2e38; font-size: 0.95rem; }
.console-input-node:focus { border-color: var(--border-active-cyan); box-shadow: 0 0 14px rgba(6, 182, 212, 0.12); }

.password-node-wrapper { position: relative; width: 100%; }
.password-visibility-toggle {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; outline: none; color: #3f3f46; cursor: pointer;
}
.password-visibility-toggle:hover { color: var(--text-pure-white); }
.svg-eye-icon { width: 16px; height: 16px; display: block; }

/* Interactive Diagnostic Notification Feedback Container Layout */
.auth-diagnostic-feedback {
    font-family: monospace; font-size: 0.8rem; font-weight: 700;
    padding: 10px 14px; border-radius: 8px; display: none; width: 100%;
}
/* Alternating semantic verification color palettes rules mapping */
.auth-diagnostic-feedback.error-triggered { display: block; color: #ef4444; background: rgba(239, 68, 68, 0.04); border: 1px solid rgba(239, 68, 68, 0.15); }
.auth-diagnostic-feedback.success-triggered { display: block; color: #a3e635; background: rgba(163, 230, 53, 0.04); border: 1px solid rgba(163, 230, 53, 0.15); text-shadow: 0 0 4px rgba(163, 230, 53, 0.2); }

/* Premium Full-Width Action Trigger Dispatch Button */
.form-submit-row { width: 100%; margin-top: 4px; }
.transmission-dispatch-btn {
    width: 100%; padding: 16px; border-radius: 100px; border: none; outline: none; cursor: pointer;
    font-family: var(--font-display-stack); font-size: 1.02rem; font-weight: 700; letter-spacing: 0.02em;
    background: linear-gradient(90deg, #38bdf8 0%, #06b6d4 50%, #0284c7 100%); color: var(--bg-universe-pitch);
    box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15); transition: transform 0.1s, box-shadow 0.3s;
}
.transmission-dispatch-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(6, 182, 212, 0.35); }

.registration-footnote { width: 100%; text-align: center; margin-top: 6px; font-size: 0.88rem; color: var(--text-muted-gray); }
.create-account-link { color: var(--text-pure-white); text-decoration: none; font-weight: 600; }

/* Right Wing Visual Panel Graphic Engine core map profiles */
.auth-card-visual-wing { background-color: #060609; border-left: 1px solid var(--border-premium); display: flex; justify-content: center; align-items: center; padding: 32px; }
.cinematic-core-window { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; background-color: var(--surface-card-solid); border: 1px solid var(--border-premium); border-radius: 24px; display: flex; justify-content: center; align-items: center; overflow: hidden; }

.quantum-core-matrix-vector { width: 85%; height: auto; z-index: 10; }
.chassis-float-core { transform-origin: 100px 100px; animation: spatialChassisFloatOsc 6s ease-in-out infinite; will-change: transform; }
.lens-glow-core-pulse { animation: centralOpticCorePulse 3s ease-in-out infinite; transform-origin: 100px 100px; }
.radar-scanline-actuator { transform-origin: 100px 100px; animation: radarSweepSpin 4s linear infinite; will-change: transform; }

@keyframes spatialChassisFloatOsc { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
@keyframes radarSweepSpin { 0% { transform: rotate(0deg); opacity: 0.15; } 50% { opacity: 0.7; } 100% { transform: rotate(360deg); opacity: 0.15; } }
@keyframes centralOpticCorePulse { 0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 1px var(--border-active-cyan)); } 50% { opacity: 1; filter: drop-shadow(0 0 12px var(--border-active-cyan)); } }

.core-telemetry-stamp { position: absolute; top: 20px; left: 24px; font-family: monospace; font-size: 0.65rem; color: #3f3f46; }
.crt-scanline-matrix { position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%); background-size: 100% 4px; pointer-events: none; z-index: 15; }

/* ==========================================================================
   DYNAMIC MULTI-BREAKPOINT RESPONSIVE CONSTRAINTS RE-ALIGNMENT
   ========================================================================== */
@media (max-width: 912px) {
    .secure-auth-card-model { grid-template-columns: 1fr; max-width: 520px; }
    .auth-card-visual-wing { display: none; }
    .auth-card-form-wing { padding: 36px; }
}
@media (max-width: 480px) {
    .auth-system-body { padding: 16px 3%; }
    .auth-card-form-wing { padding: 24px; gap: 20px; }
    .auth-main-title { font-size: 1.75rem; }
}

</style>

<script>
    /**
 * Stackly Secure Signup Console Interactivity, Verification Sweeper & Redirect Engine
 */
document.addEventListener('DOMContentLoaded', () => {

    const signupForm = document.getElementById('stacklySignupForm');
    const signupAlertBox = document.getElementById('signupAlertBox');
    const submitBtn = document.getElementById('submitDispatchBtn');
    
    // Select all inputs within the form matrix
    const formInputNodes = signupForm.querySelectorAll('.console-input-node');

    // 1. DUAL MULTI-INPUT PASSKEY EYE VISIBILITY TOGGLES
    const eyeVisibilityButtons = signupForm.querySelectorAll('.toggle-visibility-btn');
    
    eyeVisibilityButtons.forEach(button => {
        button.addEventListener('click', () => {
            const correspondingInputNode = button.previousElementSibling;
            if (correspondingInputNode) {
                const currentFieldType = correspondingInputNode.getAttribute('type');
                if (currentFieldType === 'password') {
                    correspondingInputNode.setAttribute('type', 'text');
                    button.style.color = "var(--border-active-cyan)";
                } else {
                    correspondingInputNode.setAttribute('type', 'password');
                    button.style.color = "";
                }
            }
        });
    });


    // 2. FORM REGISTRATION VERIFIER VALIDATION & REDIRECT FLOW
    if (signupForm && signupAlertBox && submitBtn) {
        signupForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Intercept browser primitive instantaneous reload cycles

            let totalEmptyFieldsCount = 0;
            signupAlertBox.className = "auth-diagnostic-feedback"; // Clear state class frames

            // Sweep and trace verification metrics across fields entries
            formInputNodes.forEach(input => {
                if (input.value.trim() === "") {
                    totalEmptyFieldsCount++;
                    input.style.borderColor = "#ef4444";
                    input.style.boxShadow = "0 0 10px rgba(239, 68, 68, 0.12)";
                } else {
                    input.style.borderColor = "";
                    input.style.boxShadow = "";
                }
            });

            // Condition A: Intercept empty submissions path flags
            if (totalEmptyFieldsCount > 0) {
                signupAlertBox.innerText = "Provision Failure: Please populate all fields nodes to initialize deployment.";
                signupAlertBox.classList.add('error-triggered');
                return;
            }

            // Verify Password and Confirmation Password fields match perfectly
            const firstPasswordInput = document.getElementById('regPasswordField').value;
            const confirmationPasswordInput = document.getElementById('regConfirmPasswordField').value;

            if (firstPasswordInput !== confirmationPasswordInput) {
                signupAlertBox.innerText = "Provision Failure: Authorization Passkeys do not match.";
                signupAlertBox.classList.add('error-triggered');
                document.getElementById('regPasswordField').style.borderColor = "#ef4444";
                document.getElementById('regConfirmPasswordField').style.borderColor = "#ef4444";
                return;
            }

            // Condition B: Valid configuration criteria met perfectly pass trace
            signupAlertBox.innerText = "SUCCESS // NODE REGISTERED: Verification logs written. Redirecting to login...";
            signupAlertBox.classList.add('success-triggered');
            
            // Deactivate trigger action button to block double form transmission submission runs
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.5";
            submitBtn.style.cursor = "not-allowed";

            // Enforce fluid 2.2 second latency delay tracker timeout loop before pushing navigation transitions
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2200);
        });

        // Instantly drop alert bounds parameters if user initializes input modifications updates
        formInputNodes.forEach(input => {
            input.addEventListener('input', () => {
                input.style.borderColor = "";
                input.style.boxShadow = "";
                signupAlertBox.className = "auth-diagnostic-feedback";
            });
        });
    }

});

</script>
</body>
</html>
