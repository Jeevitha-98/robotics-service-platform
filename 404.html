
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Platform // 404 Route Aborted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-system-body">

    <!-- Cinematic Cosmic Space Grid Background -->
    <div class="error-spatial-matrix-grid"></div>
    <div class="error-hero-dimmer-shield"></div>

    <!-- Centralized 404 Terminal Container Core Panel -->
    <main class="error-terminal-card-model">
        
        <!-- LEFT REGION: High-Glow Error Code Narrative Metrics -->
        <section class="error-card-form-wing">
            <span class="hud-mini-accent-tag">// CRITICAL THREAD INTERRUPT // 404</span>
            <h1 class="error-main-title">ROUTE INTERFACE ABORTED.</h1>
            <p class="error-subtext-desc">
                The synchronized network block or diagnostic log sequence you are searching for does not exist on this localized instance matrix stack.
            </p>

            <!-- Dual Micro-Action Operational Floating Buttons Hub -->
            <div class="error-floating-actions">
                <!-- Button 1: Return to home framework -->
                <a href="index.html" class="error-float-btn solid-white">Home Platform</a>
                
                <!-- Button 2: Dynamic history validation back to same section -->
                <button type="button" class="error-float-btn ghost-translucent" id="errorBackToSectionBtn">
                    Re-Initialize Previous Link
                </button>
            </div>
        </section>

        <!-- RIGHT REGION: Continuous Moving 2.5D Server Rack Vector Chassis -->
        <section class="error-card-visual-wing">
            <div class="cinematic-core-window">
                <span class="core-telemetry-stamp">ERROR_LOG_FEED // NODE_FRACTURE_V4</span>
                
                <!-- Highly Creative Multi-Axis Processing Grid Engine Blueprint Vector -->
                <svg class="quantum-core-matrix-vector" viewBox="0 0 200 200" xmlns="http://w3.org">
                    <defs>
                        <linearGradient id="armorMetalShade" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3f3f46"/>
                            <stop offset="60%" stop-color="#18181b"/>
                            <stop offset="100%" stop-color="#09090b"/>
                        </linearGradient>
                        <radialGradient id="processorLaserGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="45%" stop-color="#ef4444"/> <!-- Threat crimson alert hue -->
                            <stop offset="100%" stop-color="#000000"/>
                        </radialGradient>
                    </defs>
                    <circle cx="100" cy="100" r="86" fill="none" stroke="#1c1c1f" stroke-width="0.75" stroke-dasharray="4 6"/>
                    <rect x="25" y="25" width="150" height="150" fill="none" stroke="#141416" stroke-width="0.5" stroke-dasharray="2 4"/>
                    <line x1="100" y1="10" x2="100" y2="190" stroke="#1c1c1f" stroke-width="0.5" stroke-dasharray="2 2"/>
                    <g class="chassis-float-core">
                        <polygon points="100,34 156,66 154,134 100,166 46,134 44,66" fill="url(#armorMetalShade)" stroke="#27272a" stroke-width="2.5"/>
                        <path d="M100 34 V166 M44 66 H156 M44 134 H154" stroke="#050507" stroke-width="2" opacity="0.4"/>
                        <circle cx="72" cy="54" r="2" fill="#3f3f46"/>
                        <circle cx="128" cy="54" r="2" fill="#3f3f46"/>
                        <circle cx="72" cy="146" r="2" fill="#3f3f46"/>
                        <circle cx="128" cy="146" r="2" fill="#3f3f46"/>
                        <circle cx="100" cy="100" r="24" fill="url(#processorLaserGlow)" class="lens-glow-core-pulse" stroke="#ef4444" stroke-width="1.5"/>
                        <circle cx="100" cy="100" r="9" fill="#050507" opacity="0.8"/>
                        <line x1="100" y1="100" x2="154" y2="66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" class="radar-scanline-actuator"/>
                    </g>
                </svg>

                <div class="crt-scanline-matrix"></div>
            </div>
        </section>

    </main>

  <style>
    /* ==========================================================================
   SPATIAL 404 ROUTE TERMINAL MODULE (Strict Typography & Card Alignment)
   ========================================================================== */
:root {
    --bg-universe-pitch: #050507;
    --surface-card-solid: #0d0d12;
    --text-pure-white: #ffffff;
    --text-muted-gray: #8b949e;
    --border-premium: rgba(255, 255, 255, 0.05);
    --neon-crimson-alert: #ef4444;
    --font-display-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

.error-system-body {
    background-color: var(--bg-universe-pitch);
    font-family: var(--font-display-stack);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 4%;
    position: relative;
    overflow-x: hidden;
}

/* Background Cosmic Matrix Grid Shaders */
.error-hero-dimmer-shield { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(5,5,7,0.3) 0%, rgba(5,5,7,0.95) 100%); z-index: 2; pointer-events: none; }
.error-spatial-matrix-grid { position: absolute; inset: 0; background-image: linear-gradient(to right, #101014 1px, transparent 1px), linear-gradient(to bottom, #101014 1px, transparent 1px); background-size: 56px 56px; opacity: 0.5; z-index: 1; pointer-events: none; }

/* Centralized Bento Card Model Box Frame mapping sign-in proportions */
.error-terminal-card-model {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 960px;
    background-color: #09090d;
    border: 1px solid var(--border-premium);
    border-radius: 28px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 40px rgba(239, 68, 68, 0.02);
    overflow: hidden;
}

.error-card-form-wing {
    padding: 56px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
}

.hud-mini-accent-tag {
    font-family: monospace; font-size: 0.72rem; font-weight: 700; color: var(--neon-crimson-alert); letter-spacing: 0.06em;
    text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
}

.error-main-title { font-size: 2.3rem; font-weight: 900; letter-spacing: -0.03em; color: var(--text-pure-white); line-height: 1.15; }
.error-subtext-desc { font-size: 1.05rem; color: var(--text-muted-gray); line-height: 1.6; max-width: 480px; }

/* Organic Floating Call-To-Action Button Hub */
.error-floating-actions { display: flex; gap: 16px; align-items: center; width: 100%; margin-top: 12px; }

.error-float-btn {
    padding: 16px 32px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: var(--font-display-stack);
    transition: background-color 0.3s, color 0.3s, border-color 0.3s, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
    animation: errorCtaFloatOscillation 5.5s ease-in-out infinite;
}

.error-float-btn.solid-white { background-color: var(--text-pure-white); color: var(--bg-universe-pitch); animation-delay: 0.2s; }
.error-float-btn.solid-white:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(255, 255, 255, 0.1); }

.error-float-btn.ghost-translucent { background-color: transparent; color: var(--text-pure-white); border-color: var(--border-premium); animation-delay: 0.8s; }
.error-float-btn.ghost-translucent:hover { background-color: rgba(255, 255, 255, 0.02); border-color: var(--text-pure-white); transform: translateY(-5px) scale(1.02); }

@keyframes errorCtaFloatOscillation { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }

/* Right Wing Visual Panel Component Data Map Shaders */
.error-card-visual-wing { background-color: #060609; border-left: 1px solid var(--border-premium); display: flex; justify-content: center; align-items: center; padding: 32px; }
.cinematic-core-window { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; background-color: var(--surface-card-solid); border: 1px solid var(--border-premium); border-radius: 24px; display: flex; justify-content: center; align-items: center; overflow: hidden; }

.quantum-core-matrix-vector { width: 85%; height: auto; z-index: 10; }
.chassis-float-core { transform-origin: 100px 100px; animation: spatialChassisFloatOsc 6s ease-in-out infinite; will-change: transform; }
.lens-glow-core-pulse { animation: centralOpticCorePulse 3s ease-in-out infinite; transform-origin: 100px 100px; }
.radar-scanline-actuator { transform-origin: 100px 100px; animation: radarSweepSpin 4s linear infinite; will-change: transform; }

@keyframes spatialChassisFloatOsc { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-10px) scale(1.01); } }
@keyframes radarSweepSpin { 0% { transform: rotate(0deg); opacity: 0.15; } 50% { opacity: 0.7; } 100% { transform: rotate(360deg); opacity: 0.15; } }
@keyframes centralOpticCorePulse { 0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 1px var(--neon-crimson-alert)); } 50% { opacity: 1; filter: drop-shadow(0 0 14px var(--neon-crimson-alert)); } }

.core-telemetry-stamp { position: absolute; top: 20px; left: 24px; font-family: monospace; font-size: 0.65rem; color: #3f3f46; }
.crt-scanline-matrix { position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%); background-size: 100% 4px; pointer-events: none; z-index: 15; }

/* ==========================================================================
   DYNAMIC MULTI-BREAKPOINT RESPONSIVE CONSTRAINTS RE-ALIGNMENT
   ========================================================================== */
@media (max-width: 912px) {
    .error-terminal-card-model { grid-template-columns: 1fr; max-width: 520px; }
    .error-card-visual-wing { display: none; } /* Hide graphic safely when layout cards snap into standard vertical stack streams */
    .error-card-form-wing { padding: 44px 36px; }
}
@media (max-width: 540px) {
    .error-floating-actions { flex-direction: column; width: 100%; gap: 12px; }
    .error-float-btn { width: 100%; text-anchor: middle; text-align: center; }
}
@media (max-width: 480px) {
    .error-system-body { padding: 16px 3%; }
    .error-card-form-wing { padding: 28px 20px; gap: 20px; }
    .error-main-title { font-size: 1.85rem; }
}

  </style>

  <script>
    /**
 * Stackly 404 Route Dynamic Section Wise Previous Page History Controller
 */
document.addEventListener('DOMContentLoaded', () => {

    const errorBackToSectionBtn = document.getElementById('errorBackToSectionBtn');

    if (errorBackToSectionBtn) {
        errorBackToSectionBtn.addEventListener('click', (event) => {
            event.preventDefault();

            // Extract the document referral baseline path history data
            const priorPageReferrerPath = document.referrer;

            if (priorPageReferrerPath && priorPageReferrerPath.trim() !== "") {
                // FIXED HISTORIC NAVIGATION CORE: Forces browser engine to restore previous coordinate context positions seamlessly
                window.location.href = priorPageReferrerPath;
            } else {
                // If direct tab entry limits browsing history, smoothly drop operator back to previous relative lane profile
                window.history.back();
            }
        });
    }

});

  </script>
</body>
</html>
